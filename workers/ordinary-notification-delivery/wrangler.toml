name = "sac-ordinary-notification-delivery"
main = "./index.ts"
compatibility_date = "2026-11-17"

# Runtime requires PUSH_SUBSCRIPTION_ENCRYPTION_KEY, PUSH_VAPID_PUBLIC_KEY,
# PUSH_VAPID_PRIVATE_JWK and PUSH_VAPID_SUBJECT. The Worker stays idle while
# they are absent, so notifications remain pending instead of failing.
[[d1_databases]]
binding = "DB"
database_name = "sac-db"
database_id = "892ce876-f279-409c-8f9e-06b1dca66e9d"

[triggers]
crons = ["* * * * *"]
