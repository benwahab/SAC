name = "sac-gps-relay"
main = "index.ts"
compatibility_date = "2026-11-20"

[vars]
GPS_RELAY_E2EE_READY = "false"

[[d1_databases]]
binding = "DB"
database_name = "sac-db"
database_id = "892ce876-f279-409c-8f9e-06b1dca66e9d"

[[durable_objects.bindings]]
name = "GPS_ROOMS"
class_name = "GpsRelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GpsRelayRoom"]

[observability]
enabled = true
head_sampling_rate = 0
