name = "sac-gps-relay"
main = "index.ts"
compatibility_date = "2026-11-20"

[vars]
GPS_RELAY_E2EE_READY = "true"

[[d1_databases]]
binding = "DB"
database_name = "sac-db"
database_id = "892ce876-f279-409c-8f9e-06b1dca66e9d"

# Keep the legacy endpoint alive by forwarding its DO binding to sac-app.
[[durable_objects.bindings]]
name = "GPS_ROOMS"
class_name = "GpsRelayRoom"
script_name = "sac-app"

# Commit the existing namespace transfer; do not create or delete a namespace.
[exports.GpsRelayRoom]
type = "durable-object"
state = "transferred"
transferred_to = "sac-app"

[observability]
enabled = true
head_sampling_rate = 0
