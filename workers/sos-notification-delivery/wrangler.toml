name = "sac-sos-notification-delivery"
main = "./index.ts"
compatibility_date = "2026-11-17"

[secrets]
required = [
  "PUSH_SUBSCRIPTION_ENCRYPTION_KEY",
  "PUSH_VAPID_PUBLIC_KEY",
  "PUSH_VAPID_PRIVATE_JWK",
  "PUSH_VAPID_SUBJECT",
]

[[d1_databases]]
binding = "DB"
database_name = "sac-db"
database_id = "892ce876-f279-409c-8f9e-06b1dca66e9d"

[triggers]
crons = ["* * * * *", "0 * * * *"]
