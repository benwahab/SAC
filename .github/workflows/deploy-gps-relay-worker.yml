name: Deploy SAC GPS relay Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/gps-relay/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-gps-relay-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sac-gps-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy GPS relay Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: e354b8c45c7d099a846d530af7e84014
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/sac-gps-relay-bundle --config workers/gps-relay/wrangler.toml

      - name: Upload compiled Worker bundle for direct release
        uses: actions/upload-artifact@v4
        with:
          name: sac-gps-relay-worker-bundle
          path: /tmp/sac-gps-relay-bundle/
          if-no-files-found: error
          retention-days: 3

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config workers/gps-relay/wrangler.toml

      - name: Report deployment handoff
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::GitHub Actions has no CLOUDFLARE_API_TOKEN. The compiled bundle is attached as an artifact for release through the connected Cloudflare API."

      - name: Verify active production deployment
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deployments status --name sac-gps-relay --config workers/gps-relay/wrangler.toml
