name: Deploy SAC GPS relay Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/gps-relay/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-gps-relay-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sac-gps-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy GPS relay Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: e354b8c45c7d099a846d530af7e84014
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate Worker without deploying
        run: npx wrangler deploy --dry-run --config workers/gps-relay/wrangler.toml

      - name: Deploy Worker
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured; GPS relay deployment cannot proceed."
            exit 1
          fi
          npx wrangler deploy --config workers/gps-relay/wrangler.toml

      - name: Verify active production deployment
        run: npx wrangler deployments status --name sac-gps-relay --config workers/gps-relay/wrangler.toml
