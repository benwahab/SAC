name: Bootstrap npm lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sac-bootstrap-npm-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Pin npm version
        run: npm install --global npm@10.9.9
      - name: Generate the lockfile with npm
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; refusing to regenerate it automatically."
            exit 0
          fi
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
      - name: Verify clean installation from the generated lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test experimental location encryption primitive
        run: npm run test:crypto
      - name: Test device lifecycle domain contract
        run: npm run test:devices
      - name: Test root-signed device certificates
        run: npm run test:certificates
      - name: Test per-device session authorization
        run: npm run test:sessions
      - name: Test alert lifecycle domain contract
        run: npm run test:alerts
      - name: Test alert response and responsibility contract
        run: npm run test:responses
      - name: Test trip protection domain contract
        run: npm run test:trips
      - name: Test account deletion lifecycle domain contract
        run: npm run test:accounts
      - name: Test account authentication and session policy
        run: npm run test:auth-policy
      - name: Test Resend email adapter and delivery outcomes
        run: npm run test:email
      - name: Test validated email OTP policy
        run: npm run test:otp-policy
      - name: Test secure email OTP generation and digest
        run: npm run test:otp-code
      - name: Test account password hashing
        run: npm run test:password-hash
      - name: Apply D1 migrations to an isolated local database
        run: npx wrangler d1 migrations apply sac-db --local
      - name: Test D1 email OTP schema and atomic triggers
        run: python3 tests/d1_email_otp_schema.test.py
      - name: Test registration input policy
        run: npm run test:registration-policy
      - name: Build
        run: npm run build
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (same non-blocking policy as main CI)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Verify lockfile metadata and diff
        run: |
          npm ls --depth=0
          git diff --check
          git status --short
      - name: Commit the verified lockfile to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "A lockfile is already tracked; refusing to overwrite it."
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "main moved during lockfile generation; refusing a non-fast-forward update."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): add verified npm lockfile"
          git push origin HEAD:refs/heads/main
