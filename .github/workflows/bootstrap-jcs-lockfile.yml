name: Bootstrap JCS dependency lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-jcs-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sac-bootstrap-jcs-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Pin npm version
        run: npm install --global npm@10.9.9
      - name: Generate lockfile from exact JCS dependency
        # Regenerate after the RFC fixture correction.
        run: |
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
      - name: Verify clean install
        run: npm ci
      - name: Test RFC 8785 JCS vectors
        run: npm run test:jcs
      - name: Typecheck
        run: npm run typecheck
      - name: Run existing cryptographic tests
        run: npm run test:crypto && npm run test:certificates
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Inspect dependency tree
        run: npm ls --depth=0
      - name: Commit verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "main moved during lockfile generation; refusing update."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): lock canonicalize 5.1.0"
          git push origin HEAD:refs/heads/main
