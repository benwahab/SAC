name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit des dépendances
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n + ' | ' + v.severity + ' | ' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable))"
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
