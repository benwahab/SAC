name: SAC quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Pin npm version
        run: npm install --global npm@10.9.9
      - run: npm ci
      - name: Test same-origin JSON request guard for public authentication endpoints
        run: npm run test:http-request-guard
      - name: Test bounded streaming JSON request bodies for authentication endpoints
        run: npm run test:json-request-body
      - name: Test authentication endpoint input boundaries before database access
        run: npm run test:auth-endpoints
      - name: Install pinned SimpleWebAuthn runtime-smoke dependency (test only)
        run: npm install --no-save --package-lock=false @simplewebauthn/server@14.1.0
      - name: Test SimpleWebAuthn inside local Cloudflare Workers runtime
        run: npm run test:webauthn-workers
      - name: Test SAC single-device WebAuthn root policy
        run: npm run test:webauthn-root-policy
      - name: Test browser-side WebAuthn root credential adapter
        run: npm run test:webauthn-browser
      - name: Test server-side WebAuthn root registration options
        run: npm run test:webauthn-root-options
      - name: Test WebAuthn origin and RP ID allowlist
        run: npm run test:webauthn-origin
      - name: Test WebAuthn root registration cryptographic verifier
        run: npm run test:webauthn-root-verifier
      - name: Test root enrollment and session endpoint boundaries
        run: npm run test:root-enrollment-endpoints
      - name: Test PWA root enrollment client flow
        run: npm run test:root-enrollment-client
      - name: Apply isolated D1 enrollment test migration (local only)
        run: npx wrangler d1 migrations apply sac-d1-enrollment-atomicity-test --local --config tests/wrangler.d1-atomicity.toml
      - name: Test D1 enrollment challenge atomicity, rollback and concurrent replay
        run: npm run test:d1-enrollment-atomicity
      - name: Test independent anti-rollback anchor model and fail-closed recovery
        run: npm run test:anti-rollback-model
      - name: Test isolated ACL UDE contract model (not an Azure integration test)
        run: npm run test:acl-ude-contract
      - name: Test full RFC 8785 Appendix B numeric vector set
        run: npm run test:jcs
      - name: Test strict JSON boundary parser and duplicate-key rejection
        run: npm run test:jcs-input
      - name: Test JCS and Web Crypto in local Cloudflare Workers runtime
        run: npm run test:jcs-worker
      - name: Test P-256 ECDSA RFC 6979 signature interoperability
        run: npm run test:ecdsa
      - name: Test strict ECDSA DER and P1363 format adapters
        run: npm run test:ecdsa-der
      - name: Test canonical P-256 JWK coordinate encoding
        run: npm run test:p256-jwk
      - name: Test API and D1 schema readiness endpoint
        run: npm run test:health
      - run: npm run typecheck
      - name: Test experimental location encryption primitive
        run: npm run test:crypto
      - name: Test encrypted Web Push subscription cryptography
        run: npm run test:push-subscriptions
      - name: Test D1 push subscription isolation and device revocation
        run: python3 tests/d1_push_subscriptions_schema.test.py
      - name: Test Web Push encryption, VAPID signatures and SSRF endpoint allowlist
        run: npm run test:web-push-delivery
      - name: Test device lifecycle domain contract
        run: npm run test:devices
      - name: Test root-signed device certificates
        run: npm run test:certificates
      - name: Test per-device session authorization
        run: npm run test:sessions
      - name: Test opaque session token generation and hashing
        run: npm run test:session-tokens
      - name: Test strict host-only session cookie handling
        run: npm run test:session-cookies
      - name: Test alert lifecycle domain contract
        run: npm run test:alerts
      - name: Test alert response and responsibility contract
        run: npm run test:responses
      - name: Test trip protection domain contract
        run: npm run test:trips
      - name: Test account deletion lifecycle domain contract
        run: npm run test:accounts
      - name: Test trusted contact invitation lifecycle domain contract
        run: npm run test:contact-invitations
      - name: Test account authentication and session policy
        run: npm run test:auth-policy
      - name: Test Brevo email adapter and delivery outcomes
        run: npm run test:email
      - name: Test trusted contact invitation email delivery adapter
        run: npm run test:contact-invitation-email
      - name: Test validated email OTP policy
        run: npm run test:otp-policy
      - name: Test secure email OTP generation and digest
        run: npm run test:otp-code
      - name: Test account password hashing
        run: npm run test:password-hash
      - name: Apply D1 migrations to an isolated local database
        run: npx wrangler d1 migrations apply sac-db --local
      - name: Test D1 email OTP schema and atomic triggers
        run: python3 tests/d1_email_otp_schema.test.py
      - name: Test D1 root device enrollment, credential and session constraints
        run: npm run test:d1-root-device-enrollment
      - name: Test D1 trusted contact invitation and relationship constraints
        run: python3 tests/d1_contact_invitations_schema.test.py
      - name: Test D1 SOS recipient snapshots, event chronology and reminder constraints
        run: python3 tests/d1_alerts_schema.test.py
      - name: Test D1 per-device notification retention schema and bounded purge contract
        run: npm run test:d1-notification-retention
      - name: Test D1 GPS relay one-time ticket schema and replay prevention
        run: npm run test:d1-gps-relay-tickets
      - name: Test GPS WebSocket subprotocol negotiation and ticket boundaries
        run: npm run test:gps-relay-protocol
      - name: Test SOS service end-to-end against isolated local D1
        run: npm run test:sos-d1
      - name: Test trusted contact service against isolated local D1
        run: npm run test:contact-invitations-d1
      - name: Test registration input policy
        run: npm run test:registration-policy
      - run: npm run build
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (development toolchain)
        run: npm audit --audit-level=high
        continue-on-error: true
