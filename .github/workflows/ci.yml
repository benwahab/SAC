name: SAC quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Test experimental location encryption primitive
        run: npm run test:crypto
      - name: Test device lifecycle domain contract
        run: npm run test:devices
      - name: Test root-signed device certificates
        run: npm run test:certificates
      - name: Test per-device session authorization
        run: npm run test:sessions
      - name: Test alert lifecycle domain contract
        run: npm run test:alerts
      - name: Test alert response and responsibility contract
        run: npm run test:responses
      - name: Test trip protection domain contract
        run: npm run test:trips
      - name: Test account deletion lifecycle domain contract
        run: npm run test:accounts
      - name: Test account authentication and session policy
        run: npm run test:auth-policy
      - name: Test Resend email adapter and delivery outcomes
        run: npm run test:email
      - name: Test validated email OTP policy
        run: npm run test:otp-policy
      - name: Test secure email OTP generation and digest
        run: npm run test:otp-code
      - name: Test account password hashing
        run: npm run test:password-hash
      - name: Apply D1 migrations to an isolated local database
        run: npx wrangler d1 migrations apply sac-db --local
      - name: Test D1 email OTP schema and atomic triggers
        run: python3 tests/d1_email_otp_schema.test.py
      - name: Test registration input policy
        run: npm run test:registration-policy
      - run: npm run build
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (development toolchain)
        run: npm audit --audit-level=high
        continue-on-error: true
