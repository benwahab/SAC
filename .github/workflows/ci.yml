name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Corriger les dépendances vulnérables sans changement majeur
        run: npm audit fix
      - name: Enregistrer le lockfile corrigé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: mettre à jour le lockfile npm"
            git push
          fi
      - name: Audit complet des dépendances
        run: npm audit --audit-level=high
      - run: npm run build
