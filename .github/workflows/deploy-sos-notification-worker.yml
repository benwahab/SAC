name: Deploy SAC SOS notification Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sac-sos-notification-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy SOS delivery Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: e354b8c45c7d099a846d530af7e84014
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${{ secrets.PUSH_SUBSCRIPTION_ENCRYPTION_KEY }}
      PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
      PUSH_VAPID_PRIVATE_JWK: ${{ secrets.PUSH_VAPID_PRIVATE_JWK }}
      PUSH_VAPID_SUBJECT: ${{ secrets.PUSH_VAPID_SUBJECT }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install locked dependencies
        run: npm ci

      - name: Build Worker without deploying
        run: npm run test:sos-notification-worker-build

      - name: Validate and prepare runtime secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const names = [
            "PUSH_SUBSCRIPTION_ENCRYPTION_KEY",
            "PUSH_VAPID_PUBLIC_KEY",
            "PUSH_VAPID_PRIVATE_JWK",
            "PUSH_VAPID_SUBJECT",
          ];
          for (const name of names) {
            if (!process.env[name]?.trim()) throw new Error(`Missing GitHub Actions secret: ${name}`);
          }

          const decode = (value) => {
            if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error("Invalid base64url value");
            return Buffer.from(value, "base64url");
          };
          const encryptionKey = decode(process.env.PUSH_SUBSCRIPTION_ENCRYPTION_KEY);
          if (encryptionKey.length !== 32) throw new Error("PUSH_SUBSCRIPTION_ENCRYPTION_KEY must decode to 32 bytes");

          const publicKey = decode(process.env.PUSH_VAPID_PUBLIC_KEY);
          if (publicKey.length !== 65 || publicKey[0] !== 4) throw new Error("PUSH_VAPID_PUBLIC_KEY must be an uncompressed P-256 point");

          let jwk;
          try { jwk = JSON.parse(process.env.PUSH_VAPID_PRIVATE_JWK); }
          catch { throw new Error("PUSH_VAPID_PRIVATE_JWK is not valid JSON"); }
          if (jwk.kty !== "EC" || jwk.crv !== "P-256" || !jwk.d || !jwk.x || !jwk.y) {
            throw new Error("PUSH_VAPID_PRIVATE_JWK must contain a private P-256 JWK");
          }
          const point = Buffer.concat([Buffer.from([4]), decode(jwk.x), decode(jwk.y)]);
          if (point.length !== 65 || !point.equals(publicKey)) {
            throw new Error("VAPID public and private keys do not match");
          }
          if (!/^(mailto:|https:\/\/)/.test(process.env.PUSH_VAPID_SUBJECT)) {
            throw new Error("PUSH_VAPID_SUBJECT must be a mailto: or HTTPS URI");
          }

          const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          writeFileSync("/tmp/sac-sos-worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          NODE

      - name: Deploy Worker with secrets in one version
        run: >-
          npx wrangler deploy
          --config workers/sos-notification-delivery/wrangler.toml
          --secrets-file /tmp/sac-sos-worker-secrets.json

      - name: Verify active production deployment
        run: npx wrangler deployments status --name sac-sos-notification-delivery
